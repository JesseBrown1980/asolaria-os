name: Rust 1.81 + clippy (operator toolchain rule)

# OPERATOR RULE: Rust 1.81 with clippy, integer/ternary only, no float.
# This workflow replaces the previous rust-1.97-independent-verification.yml.
# The 1.97 receipts remain in docs/ as HISTORICAL evidence of past runs; they
# are not the toolchain of record.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.81.0 with clippy
        run: |
          rustup toolchain install 1.81.0 --profile minimal --component clippy
          rustup override set 1.81.0
          rustc --version
          cargo clippy --version

      - name: Clippy (deny warnings) — enforces integer/ternary discipline
        run: cargo clippy --all-targets -- -D warnings

      - name: Assert no float types in sources
        run: |
          if grep -rn --include='*.rs' -E '\bf(32|64)\b' src/ tests/ 2>/dev/null; then
            echo "FAIL: float type found; operator rule is integer/ternary only"; exit 1
          fi
          echo "OK: zero float types"

      - name: Tests
        run: cargo test --all-targets -- --nocapture

      - name: Receipt
        run: |
          {
            echo "toolchain_of_record=1.81.0"
            echo "rustc=$(rustc --version)"
            echo "clippy=$(cargo clippy --version)"
            echo "float_types=0"
            echo "rule=integer_and_ternary_only_no_float"
          } > toolchain-receipt.txt
          cat toolchain-receipt.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rust-1.81-clippy-receipt
          path: toolchain-receipt.txt
